<meta charset=utf-8>
<title>軽井沢クロニクル</title>
<meta name="color-scheme" content="light" />
<script>document.documentElement.setAttribute("data-theme","light");</script>
<script>
(function(){
  function show(msg){
    try{
      var d=document.getElementById('__bootErr');
      if(!d){ d=document.createElement('div'); d.id='__bootErr';
        d.setAttribute('style','position:fixed;left:0;right:0;top:0;z-index:99999;background:#fff;color:#8a1f1f;font:13px/1.7 -apple-system,system-ui,sans-serif;padding:16px;white-space:pre-wrap;word-break:break-word;border-bottom:4px solid #8a1f1f');
        (document.body||document.documentElement).appendChild(d); }
      d.textContent = '起動エラー\n' + msg;
    }catch(e){}
  }
  window.addEventListener('error', function(e){
    show((e.message||'error') + '\n' + (e.filename||'') + ' : ' + (e.lineno||'') + ':' + (e.colno||''));
  });
  window.addEventListener('unhandledrejection', function(e){
    var r = e.reason; show('promise: ' + (r && r.message ? r.message : String(r)));
  });
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<style>
  html { background: #F0EDE4; }
  @media (prefers-color-scheme: dark) { html[data-theme="dark"] { background: #100D09; } }
  :root {
    --bg: #E4E1D8;
    --app-bg: #F0EDE4;
    --surface: #FAF8F1;
    --surface-2: #FFFFFF;
    --ink: #241E17;
    --ink-2: #5A5045;
    --ink-3: #948a7d;
    --line: #E1DCCE;
    --line-strong: #CFC7B4;
    --accent: #2F6B45;          /* 森の緑 */
    --accent-soft: #E6EFE5;
    --accent-ink: #235539;
    --sepia: #8A6A3F;           /* 歴史の褐色 */

    --gold: #A97C2E;
    --crimson: #B23B3B;
    --frame: #17140F;
    --shadow: 30px 60px 120px rgba(40,32,20,.30), 0 8px 30px rgba(40,32,20,.14);
    --ok: #2F8C57;
    --ng: #C0472F;
    --ok-bg: #E8F3EC;
    --ng-bg: #F8E7E2;
    --accent-line: #A8C6B3;
    --tabbar-bg: #FAF8F1;
    --map-bg: #E9F1E1;
    --map-land: #DCE8CE;
    --map-water: #A8CCE3;
    --map-line: #C6D4BA;
    --map-tree: #5E8C52;
    --map-tree2: #7CA96C;
    --map-mount: #93A98F;
    --map-snow: #F4F7F1;
    --map-road: #C8A063;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #100D09;
      --app-bg: #17130D;
      --surface: #201B14;
      --surface-2: #29231A;
      --ink: #EEE8DC;
      --ink-2: #BAB0A0;
      --ink-3: #857c6e;
      --line: #322A20;
      --line-strong: #3E3428;
      --accent: #7CBE93;
      --accent-soft: #24302400;
      --accent-soft: #243024;
      --accent-ink: #A6DABA;
      --sepia: #C6A778;
      --sepia-soft: #2C2418;
      --gold: #D6AC63;
      --crimson: #D9776B;
      --frame: #050403;
      --shadow: 30px 60px 120px rgba(0,0,0,.6), 0 8px 30px rgba(0,0,0,.45);
      --ok: #5CB37E;
      --ng: #E0836E;
      --ok-bg: #1E2A22;
      --ng-bg: #2E1F1B;
      --accent-line: #3A5544;
      --tabbar-bg: #201B14;
      --map-bg: #161D14;
      --map-land: #1E271A;
      --map-water: #244655;
      --map-line: #2C3A28;
      --map-tree: #3E6236;
      --map-tree2: #4E7844;
      --map-mount: #4A5A48;
      --map-snow: #C9D3C4;
      --map-road: #8A6C3E;
    }
  }
  :root[data-theme="dark"] {
    --bg: #100D09; --app-bg: #17130D; --surface: #201B14; --surface-2: #29231A;
    --ink: #EEE8DC; --ink-2: #BAB0A0; --ink-3: #857c6e; --line: #322A20; --line-strong: #3E3428;
    --accent: #7CBE93; --accent-soft: #243024; --accent-ink: #A6DABA;
    --sepia: #C6A778; --sepia-soft: #2C2418; --gold: #D6AC63; --crimson: #D9776B;
    --frame: #050403; --shadow: 30px 60px 120px rgba(0,0,0,.6), 0 8px 30px rgba(0,0,0,.45);
    --ok: #5CB37E; --ng: #E0836E;
    --ok-bg: #1E2A22; --ng-bg: #2E1F1B; --accent-line: #3A5544; --tabbar-bg: #201B14;
    --map-bg: #161D14; --map-land: #1E271A; --map-water: #244655; --map-line: #2C3A28;
    --map-tree: #3E6236; --map-tree2: #4E7844; --map-mount: #4A5A48; --map-snow: #C9D3C4; --map-road: #8A6C3E;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Zen Kaku Gothic New", -apple-system, system-ui, sans-serif;
    background: radial-gradient(1200px 700px at 50% -12%, rgba(138,106,63,.14), transparent 60%), var(--bg);
    color: var(--ink); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; gap: 20px;
    padding: 32px 16px 56px; -webkit-font-smoothing: antialiased;
  }
  .mincho { font-family: "Zen Old Mincho", "Hiragino Mincho ProN", serif; }

  .stage-caption { text-align: center; max-width: 430px; }
  .stage-caption .kicker { font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--sepia); font-weight: 700; }
  .stage-caption h1 { font-family: "Zen Old Mincho", serif; font-weight: 700; font-size: 26px; margin-top: 8px; letter-spacing: .06em; }
  .stage-caption p { color: var(--ink-2); font-size: 13px; margin-top: 6px; line-height: 1.6; }
  .theme-toggle { margin-top: 13px; display: inline-flex; align-items: center; gap: 7px; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2); font-size: 12px; cursor: pointer; font-family: inherit; }
  .theme-toggle:hover { border-color: var(--sepia); color: var(--sepia); }

  .phone { width: 390px; max-width: 100%; height: 844px; max-height: 88vh; background: var(--frame); border-radius: 54px; padding: 12px; box-shadow: var(--shadow); position: relative; flex-shrink: 0; }
  @media (max-width: 430px) { body { padding: 12px 0 30px; } .phone { border-radius: 0; padding: 0; height: 100vh; max-height: none; width: 100%; box-shadow: none; } .stage-caption { padding: 0 16px; } }
  .screen { position: relative; width: 100%; height: 100%; background: var(--app-bg); border-radius: 44px; overflow: hidden; display: flex; flex-direction: column; }
  @media (max-width: 430px) { .screen { border-radius: 0; } }

  .statusbar { height: 50px; flex-shrink: 0; position: relative; z-index: 40; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; font-size: 14px; font-weight: 600; color: var(--ink); pointer-events: none; }
  .statusbar.on-hero { color: #fff; }
  .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 108px; height: 30px; background: #05080a; border-radius: 18px; z-index: 50; }
  .sb-right { display: flex; align-items: center; gap: 6px; }

  .view { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .view::-webkit-scrollbar { display: none; }
  .pad { padding: 4px 18px 26px; }

  .tabbar { flex-shrink: 0; height: 78px; display: flex; background: var(--tabbar-bg); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: 1px solid var(--line); padding-bottom: 14px; z-index: 30; }
  .tab { flex: 1; border: none; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--ink-3); font-family: inherit; font-size: 10px; font-weight: 600; padding-top: 8px; transition: color .18s; }
  .tab svg { width: 23px; height: 23px; }
  .tab.active { color: var(--accent); }

  .eyebrow { font-size: 10.5px; letter-spacing: .24em; text-transform: uppercase; color: var(--sepia); font-weight: 700; }
  .section-title { font-family: "Zen Old Mincho", serif; font-size: 20px; font-weight: 700; letter-spacing: .04em; margin: 2px 0; }
  .muted { color: var(--ink-2); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; font-size: 12.5px; font-weight: 600; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2); cursor: pointer; font-family: inherit; transition: .15s; }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .caticon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0; }
  .caticon svg { width: 21px; height: 21px; }

  .list-row { display: flex; gap: 13px; align-items: center; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 13px; cursor: pointer; text-align: left; font-family: inherit; color: var(--ink); transition: .15s; margin-bottom: 11px; }
  .list-row:hover { border-color: var(--accent); transform: translateY(-1px); }
  .list-row h4 { font-size: 15.5px; font-weight: 700; }
  .list-row p { font-size: 12px; color: var(--ink-2); line-height: 1.45; margin-top: 2px; }
  .list-meta { font-size: 10.5px; color: var(--ink-3); margin-top: 5px; display: flex; align-items: center; gap: 5px; }
  .heart { margin-left: auto; align-self: flex-start; border: none; background: none; cursor: pointer; padding: 4px; color: var(--ink-3); }
  .heart.on { color: #C7607F; }
  .heart svg { width: 20px; height: 20px; display: block; }

  .search { display: flex; align-items: center; gap: 9px; width: 100%; background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 14px; padding: 11px 14px; margin: 4px 0 14px; }
  .search input { border: none; background: none; outline: none; flex: 1; font-family: inherit; font-size: 14.5px; color: var(--ink); }
  .search svg { width: 18px; height: 18px; color: var(--ink-3); flex-shrink: 0; }

  /* hero */
  .hero { position: relative; margin: -50px -18px 0; padding: 74px 22px 26px; color: #fff; overflow: hidden; }
  .hero-sky { position: absolute; inset: 0; z-index: 0; }
  .hero-inner { position: relative; z-index: 2; }
  .hero .season-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; padding: 5px 11px; border-radius: 999px; background: rgba(255,255,255,.22); backdrop-filter: blur(4px); letter-spacing: .04em; }
  .hero h2 { font-family: "Zen Old Mincho", serif; font-size: 29px; font-weight: 700; margin-top: 14px; letter-spacing: .05em; text-shadow: 0 2px 20px rgba(0,0,0,.28); }
  .hero p { font-size: 13px; margin-top: 8px; line-height: 1.6; max-width: 32ch; opacity: .96; }
  .hero-cta { margin-top: 16px; display: inline-flex; align-items: center; gap: 7px; background: #fff; color: var(--accent-ink); border: none; font-family: inherit; font-weight: 700; font-size: 13.5px; padding: 10px 18px; border-radius: 999px; cursor: pointer; }

  .h-scroll { display: flex; gap: 13px; overflow-x: auto; padding: 2px 18px 6px; margin: 0 -18px; scrollbar-width: none; }
  .h-scroll::-webkit-scrollbar { display: none; }
  .feat { flex-shrink: 0; width: 176px; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-align: left; font-family: inherit; color: var(--ink); transition: .15s; }
  .feat:hover { transform: translateY(-2px); border-color: var(--accent); }
  .feat .thumb { height: 92px; position: relative; display: grid; place-items: center; }
  .feat .thumb .yr { position: absolute; left: 10px; bottom: 8px; font-size: 11px; font-weight: 700; color: #fff; font-family: "Zen Old Mincho", serif; letter-spacing: .04em; }
  .feat .body { padding: 11px 12px 13px; }
  .feat h4 { font-size: 13.5px; font-weight: 700; line-height: 1.3; }
  .feat p { font-size: 11px; color: var(--ink-2); margin-top: 3px; line-height: 1.4; }

  .figstrip { display: flex; gap: 11px; overflow-x: auto; padding: 2px 18px 6px; margin: 0 -18px; scrollbar-width: none; }
  .figstrip::-webkit-scrollbar { display: none; }
  .figcard { flex-shrink: 0; width: 128px; text-align: center; }
  .figavatar { width: 70px; height: 70px; border-radius: 50%; margin: 0 auto 8px; display: grid; place-items: center; color: #fff; font-family: "Zen Old Mincho", serif; font-size: 26px; font-weight: 700; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
  .figcard b { font-size: 13px; display: block; }
  .figcard span { font-size: 10.5px; color: var(--ink-3); line-height: 1.3; display: block; margin-top: 2px; }

  .shortcut-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
  .shortcut { display: flex; align-items: center; gap: 11px; padding: 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-family: inherit; color: var(--ink); text-align: left; transition: .15s; }
  .shortcut:hover { border-color: var(--accent); transform: translateY(-1px); }
  .shortcut h4 { font-size: 13.5px; font-weight: 700; }
  .shortcut span { font-size: 10.5px; color: var(--ink-3); }

  /* quiz teaser card on home */
  .quiz-teaser { position: relative; overflow: hidden; border-radius: 20px; padding: 20px; color: #fff; cursor: pointer; }
  .quiz-teaser h3 { font-family: "Zen Old Mincho", serif; font-size: 21px; font-weight: 700; }
  .quiz-teaser p { font-size: 12.5px; margin-top: 6px; opacity: .95; line-height: 1.5; }
  .quiz-teaser .go { margin-top: 14px; display: inline-flex; align-items: center; gap: 6px; background: #fff; color: var(--accent-ink); font-weight: 700; font-size: 13px; padding: 9px 16px; border-radius: 999px; }
  .quiz-teaser .best { position: absolute; top: 16px; right: 16px; font-size: 11px; background: rgba(255,255,255,.22); padding: 5px 11px; border-radius: 999px; font-weight: 700; }

  /* TIMELINE */
  .era-head { display: flex; align-items: center; gap: 10px; margin: 22px 0 8px; }
  .era-head .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--sepia); }
  .era-head h3 { font-family: "Zen Old Mincho", serif; font-size: 16px; font-weight: 700; letter-spacing: .05em; }
  .era-head .rule { flex: 1; height: 1px; background: var(--line); }
  .tItem { display: flex; gap: 14px; }
  .tRail { display: flex; flex-direction: column; align-items: center; width: 62px; flex-shrink: 0; }
  .tYear { font-family: "Zen Old Mincho", serif; font-weight: 700; font-size: 15px; color: var(--sepia); letter-spacing: .02em; }
  .tGaku { font-size: 9px; color: var(--ink-3); margin-top: 1px; }
  .tNode { width: 13px; height: 13px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); margin: 5px 0 0; z-index: 2; }
  .tLine { width: 2px; flex: 1; background: var(--line-strong); min-height: 18px; }
  .tBody { flex: 1; padding-bottom: 20px; }
  .tCard { background: var(--surface); border: 1px solid var(--line); border-radius: 15px; padding: 13px 14px; cursor: pointer; transition: .15s; }
  .tCard:hover { border-color: var(--accent); transform: translateY(-1px); }
  .tCard h4 { font-size: 14.5px; font-weight: 700; }
  .tCard p { font-size: 12px; color: var(--ink-2); line-height: 1.5; margin-top: 4px; }
  .tCard .lnk { font-size: 11px; color: var(--accent); font-weight: 700; margin-top: 7px; display: inline-flex; align-items: center; gap: 3px; }

  /* QUIZ */
  .q-hero { text-align: center; padding: 26px 10px 8px; }
  .q-badge { width: 78px; height: 78px; border-radius: 22px; margin: 0 auto 14px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--accent), var(--sepia)); box-shadow: 0 10px 24px rgba(47,107,69,.28); }
  .q-badge svg { width: 40px; height: 40px; }
  .q-hero h2 { font-family: "Zen Old Mincho", serif; font-size: 24px; font-weight: 700; letter-spacing: .04em; }
  .q-hero p { font-size: 13px; color: var(--ink-2); margin-top: 8px; line-height: 1.6; }
  .stat-row { display: flex; gap: 10px; margin: 18px 0; }
  .stat { flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 15px; padding: 14px 8px; text-align: center; }
  .stat b { font-family: "Zen Old Mincho", serif; font-size: 22px; font-weight: 700; color: var(--accent); display: block; }
  .stat span { font-size: 10.5px; color: var(--ink-3); }
  .btn-big { width: 100%; padding: 16px; border-radius: 16px; border: none; background: var(--accent); color: #fff; font-family: inherit; font-weight: 700; font-size: 15.5px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: .15s; }
  .btn-big:hover { filter: brightness(1.05); }
  .btn-ghost { width: 100%; padding: 13px; border-radius: 14px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2); font-family: inherit; font-weight: 700; font-size: 13.5px; cursor: pointer; margin-top: 10px; }

  .q-progress { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .q-bar { flex: 1; height: 7px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .q-bar > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .3s; }
  .q-count { font-size: 12px; font-weight: 700; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .q-era { display: inline-block; font-size: 10.5px; font-weight: 700; color: var(--sepia); background: var(--sepia-soft); padding: 4px 10px; border-radius: 999px; margin: 16px 0 10px; }
  .q-question { font-family: "Zen Old Mincho", serif; font-size: 21px; font-weight: 700; line-height: 1.5; letter-spacing: .02em; }
  .q-opts { margin-top: 20px; display: flex; flex-direction: column; gap: 11px; }
  .q-opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; font-family: inherit; font-size: 14.5px; font-weight: 500; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line-strong); border-radius: 15px; padding: 15px 16px; cursor: pointer; transition: .15s; }
  .q-opt:hover:not(:disabled) { border-color: var(--accent); }
  .q-opt .mk { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; font-weight: 700; font-size: 13px; color: var(--ink-3); flex-shrink: 0; }
  .q-opt.correct { border-color: var(--ok); background: var(--ok-bg); }
  .q-opt.correct .mk { background: var(--ok); border-color: var(--ok); color: #fff; }
  .q-opt.wrong { border-color: var(--ng); background: var(--ng-bg); }
  .q-opt.wrong .mk { background: var(--ng); border-color: var(--ng); color: #fff; }
  .q-opt:disabled { cursor: default; }
  .q-exp { margin-top: 18px; border-radius: 15px; padding: 15px 16px; background: var(--accent-soft); border: 1px solid var(--accent-line); animation: fade .3s ease; }
  .q-exp .verdict { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .q-exp p { font-size: 13px; color: var(--ink); line-height: 1.7; margin-top: 7px; }

  .result-medal { width: 96px; height: 96px; border-radius: 50%; margin: 8px auto 16px; display: grid; place-items: center; color: #fff; font-family: "Zen Old Mincho", serif; font-size: 40px; font-weight: 700; box-shadow: 0 12px 30px rgba(0,0,0,.2); }
  .result-score { font-family: "Zen Old Mincho", serif; font-size: 46px; font-weight: 900; color: var(--accent); line-height: 1; }
  .result-rank { font-family: "Zen Old Mincho", serif; font-size: 22px; font-weight: 700; margin-top: 12px; }
  .result-note { font-size: 13px; color: var(--ink-2); margin-top: 8px; line-height: 1.6; }

  /* segmented control */
  .seg { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 13px; padding: 4px; margin: 14px 0; }
  .seg-btn { flex: 1; border: none; background: none; font-family: inherit; font-size: 13px; font-weight: 700; color: var(--ink-2); padding: 9px 6px; border-radius: 10px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: .15s; }
  .seg-btn.on { background: var(--accent); color: #fff; }

  /* course card */
  .crs-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 13px; cursor: pointer; transition: .15s; }
  .crs-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .crs-badge { font-size: 11px; font-weight: 700; color: var(--accent-ink); background: var(--accent-soft); padding: 4px 11px; border-radius: 999px; }
  .crs-metrics { display: flex; gap: 14px; margin-top: 11px; font-size: 11.5px; color: var(--sepia); font-weight: 600; flex-wrap: wrap; }
  .crs-metrics span { display: inline-flex; align-items: center; gap: 4px; }

  /* trip game */
  .trip-path { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 2px; margin: 6px 0 4px; }
  .tp-node { display: flex; flex-direction: column; align-items: center; width: 52px; }

  get(k,d){ try { const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);} catch(e){ return (window.__m&&window.__m[k])??d; } },
  set(k,v){ try { localStorage.setItem(k,JSON.stringify(v)); } catch(e){ (window.__m=window.__m||{})[k]=v; } },
};

/* ---------------- RENDER ---------------- */
function render(){
  const v = el("view"); v.scrollTop = 0;
  el("statusbar").classList.toggle("on-hero", currentTab==="home");
  ({home:viewHome,timeline:viewTimeline,stories:viewStories,quiz:viewQuiz,spots:viewSpots}[currentTab])();
  v.firstElementChild && v.firstElementChild.classList.add("fade");
  renderTabs();
  if(currentTab==="spots" && spotMapMode) placePins();
}
function setView(html){ el("view").innerHTML = html; }

function shuffle(n){ // deterministic-ish shuffle without Math.random on load; use time seed
  const a=[...Array(n).keys()];
  let seed = (new Date().getTime())>>>0 || 12345;
  for(let i=a.length-1;i>0;i--){ seed=(seed*1103515245+12345)&0x7fffffff; const j=seed%(i+1); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function startQuiz(){
  quiz = { phase:"play", order:shuffle(QUIZ.length), idx:0, score:0, answered:false, picked:-1 };
  render();
}
function quizPlay(){
  const total = quiz.order.length;
  const item = QUIZ[quiz.order[quiz.idx]];
  const pct = Math.round((quiz.idx + (quiz.answered?1:0))/total*100);
  const opts = item.opts.map((o,i)=>{
    let cls="q-opt"; let mk = String.fromCharCode(65+i);
    if(quiz.answered){

    return `<button class="${cls}" data-opt="${i}" ${quiz.answered?"disabled":""}>

  }).join("");
  const correct = quiz.answered && quiz.picked===item.ans;
  setView(`<div class="pad">

    `:``}
  </div>`);
}
function answerQuiz(i){

const LAT_MIN=36.320,LAT_MAX=36.440,LON_MIN=138.528,LON_MAX=138.660;
const projX=lon=>8+(lon-LON_MIN)/(LON_MAX-LON_MIN)*84;
const projY=lat=>90-(lat-LAT_MIN)/(LAT_MAX-LAT_MIN)*80;
function currentSpotList(){ const q=spotQuery.trim(); let l=SPOTS; if(spotFilter)l=l.filter(s=>s.cat===spotFilter); if(q)l=l.filter(s=>(s.name+s.reading+s.summary+s.area).includes(q)); return l; }
const SHORT_NAME = {
  kumoba:"雲場池", ginza:"旧軽銀座", stpaul:"聖パウロ教会", shaw:"ショー礼拝堂",
  mampei:"万平ホテル", usui:"見晴台", shiraito:"白糸の滝", onioshi:"鬼押出し園",
  harunire:"ハルニレ", stone:"石の教会", prince:"プリンス", taliesin:"タリアセン",
  golf72:"72ゴルフ"
};
const MAP_POS = {
  onioshi:[16,10], shiraito:[44,22], usui:[86,22], shaw:[68,35],
  stpaul:[88,45], harunire:[22,47], ginza:[66,55], stone:[20,62],
  mampei:[86,62], kumoba:[52,68], taliesin:[34,76], prince:[82,80],
  golf72:[58,89]
};
const KAIDO_POS = [[8,90],[28,85],[52,79],[74,70]];
function placePins(){
  const layer=el("pinLayer"); if(!layer) return;
  const MAPW=360, MAPH=520;
  const CH=24/MAPH*100, GAP=13/MAPH*100;
  const placed=[];
  function wPct(l){ return ((l.length*10.4)+42)/MAPW*100; }
  function fits(x,yTop,w){
    return !placed.some(function(q){
      return Math.abs(q.x-x) < (q.w+w)/2 && Math.abs(q.y-yTop) < CH*1.05;
    });
  }
  function edge(x,w){
    if(x-w/2 < 1) return " edge-l";
    if(x+w/2 > 99) return " edge-r";
    return "";
  }
  const juku = KAIDO.map(function(k,i){
    const pos=KAIDO_POS[i]||[projX(k.lon),projY(k.lat)];
    placed.push({x:pos[0], y:pos[1]-CH*0.9, w:10});
    return '<div class="pin juku" style="left:'+pos[0]+'%;top:'+pos[1]+'%" data-juku="'+i+'">'
      +'<div class="juku-badge">宿</div><div class="juku-name">'+esc(k.name)+'</div></div>';
  }).join("");

  const items = currentSpotList().map(function(sp){
    const pos = MAP_POS[sp.id] || [projX(sp.lon), projY(sp.lat)];
    return {sp:sp, x:pos[0], y:pos[1], label:(SHORT_NAME[sp.id]||sp.name)};
  }).sort(function(a,b){ return a.y-b.y; });

  const spots = items.map(function(it){
    const sp=it.sp, c=CAT[sp.cat].color, w=wPct(it.label);
    let lift=GAP, yTop=it.y-GAP-CH;
    for(let k=0;k<12;k++){
      if(fits(it.x,yTop,w) && yTop>1) break;
      lift += CH*1.1; yTop = it.y-lift-CH;
      if(yTop<1){ lift=GAP; yTop=it.y-GAP-CH; break; }
    }
    placed.push({x:it.x, y:yTop, w:w});
    const leadPx=Math.round(lift/100*MAPH);
    return '<div class="pin'+edge(it.x,w)+'" style="left:'+it.x+'%;top:'+it.y+'%" data-spot="'+sp.id+'">'
      +'<span class="pin-lead" style="height:'+leadPx+'px"></span>'
      +'<span class="pin-anchor" style="background:'+c+'"></span>'
      +'<div class="pin-chip" style="bottom:'+leadPx+'px"><i style="background:'+c+'">'
      +ic(CAT[sp.cat].icon,'#fff',11)+'</i><b>'+esc(it.label)+'</b></div></div>';
  }).join("");
  layer.innerHTML = juku + spots;
}
function kaidoRoute(){
  return KAIDO_POS.map(function(p,i){ return (i?'L':'M')+' '+p[0]+' '+p[1]; }).join(' ');
}
function treesSVG(){
  // 決定的な擬似乱数で木立を配置（ラベル・イラストの上に載らないよう領域を避ける）
  let seed = 20260826;
  const rnd = function(){ seed = (seed*1664525 + 1013904223) % 4294967296; return seed/4294967296; };
  const avoid = [];
  Object.keys(MAP_POS).forEach(function(k){
    const q = MAP_POS[k]; avoid.push([q[0]-17, q[1]-14, q[0]+17, q[1]+3]);
  });
  KAIDO_POS.forEach(function(q){ avoid.push([q[0]-10, q[1]-5, q[0]+10, q[1]+9]); });
  avoid.push([2,12,38,50], [36,20,54,36], [84,30,100,38], [44,86,72,96],
             [30,54,52,62], [60,4,86,12], [80,84,98,94], [0,60,20,72]);
  const busy = function(x,y){
    return avoid.some(function(b){ return x>=b[0] && x<=b[2] && y>=b[1] && y<=b[3]; });
  };
  const put=[], out=[];
  let guard=0;
  while(put.length<30 && guard<4000){
    guard++;
    const x = 3 + rnd()*94, y = 5 + rnd()*88;
    if(busy(x,y)) continue;
    if(put.some(function(t){ return Math.abs(t[0]-x)<7.5 && Math.abs(t[1]-y)<6.5; })) continue;
    const kind = [0,1,1,2][Math.floor(rnd()*4)];
    put.push([x,y,kind]);
  }
  put.forEach(function(t){
    const x=t[0], y=t[1], kind=t[2];
    const h = kind===0 ? 5.0 : (kind===1 ? 6.2 : 7.2);
    const w = kind===0 ? 2.4 : (kind===1 ? 2.8 : 3.1);
    const col = kind===0 ? "var(--map-tree2)" : "var(--map-tree)";
    out.push('<g><rect x="'+(x-0.35).toFixed(1)+'" y="'+y.toFixed(1)+'" width="0.7" height="1.5" fill="var(--map-road)" opacity=".5"/>'
      +'<path d="M'+x.toFixed(1)+' '+(y-h).toFixed(1)+' L'+(x-w).toFixed(1)+' '+(y+0.2).toFixed(1)+' L'+(x+w).toFixed(1)+' '+(y+0.2).toFixed(1)+' Z" fill="'+col+'"/>'
      +'<path d="M'+x.toFixed(1)+' '+(y-h-0.2).toFixed(1)+' L'+(x-w*0.62).toFixed(1)+' '+(y-h*0.42).toFixed(1)+' L'+(x+w*0.62).toFixed(1)+' '+(y-h*0.42).toFixed(1)+' Z" fill="'+col+'" opacity=".75"/></g>');
  });
  return out.join("");
}

  if(!t) return;
  if(t.hasAttribute("data-goto")){ sightSub=t.getAttribute("data-goto"); currentTab="spots"; closeSheet(); render(); return; }
  if(t.hasAttribute("data-juku")){ openSheet(jukuSheet(KAIDO[+t.getAttribute("data-juku")])); return; }
  if(t.hasAttribute("data-fav")){ e.stopPropagation(); const id=t.getAttribute("data-fav"); toggleFav(id);
    if(el("sheet").classList.contains("open")){ t.classList.toggle("on",favs.has(id)); t.innerHTML=I.heart(favs.has(id)); }
    if(currentTab==="spots") render(); return; }

  if(t.hasAttribute("data-course")){ openSheet(sheetCourse(courseById(t.getAttribute("data-course")))); return; }
  if(t.id==="quizStart"||t.id==="quizAgain"){ startQuiz(); return; }
  if(t.id==="quizNext"){ nextQuiz(); return; }
  if(t.hasAttribute("data-opt")){ answerQuiz(+t.getAttribute("data-opt")); return; }
  if(t.hasAttribute("data-gsub")){ gameSub=t.getAttribute("data-gsub"); trip.phase="intro"; quiz.phase="intro"; render(); return; }
  if(t.id==="gameStart"){ startTrip(); return; }
  if(t.id==="gameNext"){ nextTrip(); return; }
  if(t.id==="gameAgain"){ startTrip(); return; }
  if(t.hasAttribute("data-gopt")){ answerTrip(+t.getAttribute("data-gopt")); return; }
  if(t.hasAttribute("data-tab")){ const tab=t.getAttribute("data-tab"); if(tab==="quiz"&&currentTab!=="quiz"){ quiz.phase="intro"; trip.phase="intro"; } currentTab=tab; closeSheet(); render(); return; }

  if(t.hasAttribute("data-hist")){ openSheet(sheetHistory(historyById(t.getAttribute("data-hist")))); return; }
});

    const i=el("spotSearch"); if(i){ i.focus(); i.setSelectionRange(pos,pos); } }
});
el("sheetClose").addEventListener("click", closeSheet);
el("scrim").addEventListener("click", closeSheet);
el("themeBtn").addEventListener("click", ()=>{
  const root=document.documentElement, cur=root.getAttribute("data-theme");
  const sysDark=window.matchMedia("(prefers-color-scheme: dark)").matches;
  const now=cur?cur:(sysDark?"dark":"light");
  root.setAttribute("data-theme", now==="dark"?"light":"dark");
});
function tick(){ const d=new Date(); el("clock").textContent=d.getHours()+":"+String(d.getMinutes()).padStart(2,"0"); }
tick(); setInterval(tick,20000);
renderTabs(); render();
</script>
