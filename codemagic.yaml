# ============================================================
#  ヘアサイクル — Codemagic ビルド設定
#  Mac 不使用ルート：Windows で編集 → GitHub → Codemagic がクラウドの Mac でビルド。
#  署名証明書は App Store Connect API キーからその場で自動生成する。
#
#  【Codemagic 側で必要なもの】
#   環境変数グループ "appstore"（すべて Secure）
#     APP_STORE_CONNECT_PRIVATE_KEY … App Store Connect API キーの .p8 全文
#     KEY_IDENTIFIER                … API キーの Key ID
#     ISSUER_ID                     … API キーの Issuer ID
#     CERTIFICATE_PRIVATE_KEY       … ssh-keygen で作った RSA 秘密鍵(PEM)全文
#   ※「スッと割り勘」で作成済みのグループをそのまま再利用できる。
#   ※ グループ内の BUNDLE_ID とぶつからないよう、本アプリの ID は
#     APP_BUNDLE_ID という別名で持たせている。
# ============================================================

workflows:
  ios-appstore:
    name: ヘアサイクル iOS リリース
    max_build_duration: 60
    instance_type: mac_mini_m2       # 無料枠（macOS M2 月500分）
    environment:
      groups:
        - appstore                   # API キー＋署名鍵をまとめたグループ
      vars:
        APP_BUNDLE_ID: "jp.haircutlogic.app"   # ← capacitor.config.json の appId と一致
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        DEPLOYMENT_TARGET: "15.0"
      node: 20
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      # 0) 必要な環境変数がそろっているか最初に確認（つまずきを1分で切り分ける）
      - name: 環境変数チェック
        script: |
          MISSING=0
          for V in APP_STORE_CONNECT_PRIVATE_KEY KEY_IDENTIFIER ISSUER_ID CERTIFICATE_PRIVATE_KEY; do
            eval "VAL=\${$V}"
            if [ -z "$VAL" ]; then
              echo "❌ $V が未設定です（Codemagic の変数グループ appstore を確認）"
              MISSING=1
            else
              echo "✅ $V あり"
            fi
          done
          echo "使用する Bundle ID: $APP_BUNDLE_ID"
          [ "$MISSING" = "0" ]

      # 1) 依存インストール
      - name: npm install
        script: npm install

      # 2) 単一 HTML を www/ に配置し、アイコン元画像を assets/ に用意
      - name: www とアイコンを準備
        script: npm run prepare:www

      # 3) iOS プロジェクトをクラウド側で生成（リポジトリには ios/ を含めない）
      - name: iOS プロジェクトを生成
        script: npx cap add ios

      # 4) アイコンを生成して適用（icon-1024.png から全サイズを作成）
      - name: アイコンを適用
        script: npx capacitor-assets generate --ios --iconBackgroundColor '#20304A' --iconBackgroundColorDark '#20304A'

      # 5) iPhone 専用・縦向き固定・最低 iOS を適用（iPad マルチタスク要件 -90474 を回避）
      - name: 端末とデバイス設定を適用
        script: |
          set -e
          PBX="ios/App/App.xcodeproj/project.pbxproj"
          PLIST="ios/App/App/Info.plist"
          sed -i '' 's/TARGETED_DEVICE_FAMILY = .*;/TARGETED_DEVICE_FAMILY = 1;/g' "$PBX"
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = .*;/IPHONEOS_DEPLOYMENT_TARGET = ${DEPLOYMENT_TARGET};/g" "$PBX"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null || true

      # 6) 署名：キーチェーンを準備し、証明書とプロファイルをその場で作成
      - name: キーチェーンを準備
        script: keychain initialize

      - name: 署名ファイルを取得（無ければ新規作成）
        script: |
          app-store-connect fetch-signing-files "$APP_BUNDLE_ID" \
            --issuer-id "$ISSUER_ID" \
            --key-id "$KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --type IOS_APP_STORE \
            --certificate-key "$CERTIFICATE_PRIVATE_KEY" \
            --create

      - name: 証明書をキーチェーンに登録
        script: keychain add-certificates

      - name: プロファイルを Xcode に適用
        script: xcode-project use-profiles

      # 7) ビルド番号を採番（TestFlight の最新＋1、Codemagic 通し番号を保険で併用）
      - name: ビルド番号を採番
        script: |
          TF=$(app-store-connect get-latest-testflight-build-number "$APP_BUNDLE_ID" \
                 --issuer-id "$ISSUER_ID" \
                 --key-id "$KEY_IDENTIFIER" \
                 --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" 2>/dev/null || echo 0)
          case "$TF" in ''|*[!0-9]*) TF=0 ;; esac
          NEXT=$((TF + 1))
          if [ "${BUILD_NUMBER:-0}" -gt "$NEXT" ]; then
            NEXT=$BUILD_NUMBER
          fi
          echo "採番したビルド番号: $NEXT"
          cd ios/App
          agvtool new-version -all "$NEXT"

      # 8) IPA をビルド
      - name: IPA をビルド
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $KEY_IDENTIFIER
        issuer_id: $ISSUER_ID
        submit_to_testflight: true   # TestFlight へ配信（内部テスト）
        # 審査提出は App Store Connect の画面から手動で行う想定
